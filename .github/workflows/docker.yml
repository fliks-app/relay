# Builds the image on every change to it; nothing is pushed yet.
name: Docker

on:
  push:
    branches: [main]
    paths: &paths
      - 'Dockerfile'
      - '.dockerignore'
      - 'src/**'
      - 'migrations/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths: *paths

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
