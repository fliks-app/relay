[package]
name = "fliks-relay"
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Push relay for self-hosted Fliks servers"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "http2", "json", "rustls"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
